[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cowshed"
version = "1.0.0"
description = "Cowshed sensor ingestion API and daily farm reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<1",
    # httpcore imports sniffio on every request; when it is absent the failed import
    # rescans sys.path each time and dominates the simulator's CPU time.
    "sniffio>=1.3",
    "pyarrow>=15",
    "typeguard>=4.3,<5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
cowshed = "cowshed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["cowshed"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP017"]  # timezone.utc reads clearer than datetime.UTC
