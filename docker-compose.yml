# Alternative to terraform/ for a quick local run:
#   docker compose up -d --build                 # db + api + daily scheduler
#   docker compose --profile seed run --rm seed   # replay the parquet datasets
# The parquet folder is read from COW_DATA_DIR (default ./cow_data).
name: cowshed

x-app-env: &app-env
  COWSHED_DATABASE_URL: postgresql+psycopg://cowshed:${POSTGRES_PASSWORD:-cowshed-local}@db:5432/cowshed
  COWSHED_REPORT_TIMEZONE: ${COWSHED_REPORT_TIMEZONE:-UTC}
  COWSHED_REPORT_DIR: /reports

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: cowshed
      POSTGRES_USER: cowshed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cowshed-local}
    volumes:
      - pgdata:/var/lib/postgresql/data           # data survives container restarts
      - ./sql/init:/docker-entrypoint-initdb.d:ro  # schema + views on first start
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowshed -d cowshed"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: cowshed:latest
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  scheduler:
    image: cowshed:latest
    command: ["cowshed", "schedule", "--at", "01:00", "--publish", "/reports"]
    environment: *app-env
    volumes:
      - ./reports:/reports
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    restart: unless-stopped

  seed:
    image: cowshed:latest
    profiles: ["seed"]
    command: ["cowshed", "simulate", "--data-dir", "/data", "--api-url", "http://api:8000", "--concurrency", "32"]
    volumes:
      - ${COW_DATA_DIR:-./cow_data}:/data:ro
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
